spring.application.name=field-shift
# Em hospedagem (Render etc.) a porta vem da variável de ambiente PORT.
server.port=${PORT:8080}

# Origem do front em desenvolvimento (Vite). Separe várias com vírgula.
fieldshift.cors.origens=http://localhost:5173

# Fonte do clima:
#   nasa = NASA POWER (API pública da NASA; precisa de internet)
#   mock = dados falsos, para desenvolver sem internet
#   http = serviço próprio no formato de docs/contrato-dados.md (exige fieldshift.clima.url)
fieldshift.clima.fonte=nasa
# fieldshift.clima.url=http://localhost:8000

# Agente de IA (chat "Tire dúvidas"). A chave fica SÓ no backend e vem da variável de ambiente
# ANTHROPIC_API_KEY. Sem ela, o chat responde no modo demonstração (regras fixas).
fieldshift.agente.chave=${ANTHROPIC_API_KEY:}
fieldshift.agente.modelo=claude-sonnet-5-5
